name: CI

on:
  push:
    branches: [main, chore/bootstrap-repository]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test editable installation
        run: python -m pytest
      - name: Run example
        run: python examples/import_smoke.py
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
      - name: Test wheel installation
        run: python -m pytest
      - name: Run example against wheel
        run: python examples/import_smoke.py
